<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teachers&rsquo; Day Portal — Messages</title>
<meta name="description" content="Browse public Teachers' Day messages or write your own letter to a teacher at St. Alphonsus Catholic School.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<!-- Supabase JS Client -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root {
  --bg-1: #100d33;
  --bg-2: #2c2166;
  --bg-3: #4b3f91;
  --accent: #8b6fe8;
  --gold: #f2b705;
  --gold-soft: #ffd85c;
  --text: #f5f3ff;
  --text-dim: #c6bfe8;
  --glass-bg: rgba(255, 255, 255, 0.08);
  --glass-border: rgba(255, 255, 255, 0.18);
  --glass-shadow: rgba(8, 6, 26, 0.45);
  --star-opacity: 0.85;
  --focus-ring: #ffd85c;

  --font-display: "Space Grotesk", system-ui, sans-serif;
  --font-body: "Inter", system-ui, sans-serif;
}

@media (prefers-color-scheme: light) {
  :root {
    --bg-1: #eef0fb;
    --bg-2: #dcdaf6;
    --bg-3: #c7c2ef;
    --accent: #6c5ce7;
    --gold: #b8790a;
    --gold-soft: #e0a52e;
    --text: #201a45;
    --text-dim: #55507a;
    --glass-bg: rgba(255, 255, 255, 0.55);
    --glass-border: rgba(255, 255, 255, 0.8);
    --glass-shadow: rgba(90, 80, 150, 0.18);
    --star-opacity: 0.35;
    --focus-ring: #6c5ce7;
  }
}

*, *::before, *::after {
  box-sizing: border-box;
}

html {
  scroll-padding-top: env(safe-area-inset-top, 0px);
}

body {
  margin: 0;
  min-height: 100dvh;
  font-family: var(--font-body);
  color: var(--text);
  background: linear-gradient(160deg, var(--bg-1) 0%, var(--bg-2) 55%, var(--bg-3) 100%);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0;
  overflow-x: hidden;
  transition: background 0.4s ease, opacity 0.3s ease, transform 0.3s ease;
}

body.transition-out {
  opacity: 0;
  transform: scale(0.98);
}
body.transition-in {
  animation: fadeScaleIn 0.4s ease forwards;
}

@keyframes fadeScaleIn {
  from { opacity: 0; transform: scale(0.98); }
  to { opacity: 1; transform: scale(1); }
}

.sky {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
}

.glow {
  position: absolute;
  top: 8%;
  right: 10%;
  width: min(38vw, 420px);
  height: min(38vw, 420px);
  background: radial-gradient(circle, rgba(255, 216, 92, 0.35) 0%, rgba(255, 216, 92, 0) 70%);
  filter: blur(4px);
}

.orb {
  position: absolute;
  border-radius: 50%;
  border: 1px solid rgba(255, 255, 255, 0.14);
  filter: blur(2px);
  opacity: 0.55;
}

.o1 {
  width: min(60vw, 340px);
  height: min(60vw, 340px);
  top: -12%;
  left: -14%;
  background:
    radial-gradient(circle at 32% 30%, rgba(255, 255, 255, 0.22), transparent 55%),
    radial-gradient(circle, rgba(242, 183, 5, 0.16) 0%, rgba(242, 183, 5, 0.02) 70%);
}

.o2 {
  width: min(70vw, 400px);
  height: min(70vw, 400px);
  bottom: -18%;
  right: -16%;
  background:
    radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.18), transparent 55%),
    radial-gradient(circle, rgba(139, 111, 232, 0.22) 0%, rgba(139, 111, 232, 0.02) 70%);
}

@media (prefers-color-scheme: light) {
  .orb { opacity: 0.4; }
}

.star {
  position: absolute;
  background: linear-gradient(135deg, #fff, var(--gold-soft));
  opacity: var(--star-opacity);
  clip-path: polygon(50% 0%, 61% 39%, 100% 50%, 61% 61%, 50% 100%, 39% 61%, 0% 50%, 39% 39%);
}

.s1  { width: 34px; height: 34px; top: 12%; right: 14%; }
.s2  { width: 14px; height: 14px; top: 22%; right: 26%; }
.s3  { width: 10px; height: 10px; top: 8%;  right: 30%; }
.s4  { width: 18px; height: 18px; top: 30%; right: 6%;  }
.s5  { width: 12px; height: 12px; top: 70%; left: 8%;   }
.s6  { width: 8px;  height: 8px;  top: 82%; left: 18%;  }
.s7  { width: 16px; height: 16px; top: 60%; left: 4%;   }
.s8  { width: 10px; height: 10px; top: 5%;  left: 46%;  }
.s9  { width: 7px;  height: 7px;  top: 16%; left: 58%;  }
.s10 { width: 13px; height: 13px; top: 40%; left: 12%;  }
.s11 { width: 9px;  height: 9px;  top: 48%; right: 8%;  }
.s12 { width: 15px; height: 15px; top: 88%; right: 22%; }
.s13 { width: 6px;  height: 6px;  top: 93%; left: 44%;  }
.s14 { width: 11px; height: 11px; top: 3%;  left: 20%;  }
.s15 { width: 8px;  height: 8px;  top: 55%; left: 50%;  }
.s16 { width: 12px; height: 12px; top: 75%; left: 60%;  }

@media (prefers-reduced-motion: no-preference) {
  .star { animation: twinkle 3.4s ease-in-out infinite; }
  .s2  { animation-delay: 0.6s; }
  .s3  { animation-delay: 1.2s; }
  .s4  { animation-delay: 0.3s; }
  .s5  { animation-delay: 1.6s; }
  .s6  { animation-delay: 0.9s; }
  .s7  { animation-delay: 2s;   }
  .s8  { animation-delay: 1.1s; }
  .s9  { animation-delay: 2.4s; }
  .s10 { animation-delay: 0.4s; }
  .s11 { animation-delay: 1.8s; }
  .s12 { animation-delay: 0.7s; }
  .s13 { animation-delay: 2.1s; }
  .s14 { animation-delay: 1.4s; }
  .s15 { animation-delay: 2.7s; }
  .s16 { animation-delay: 0.2s; }
}

@keyframes twinkle {
  0%, 100% { opacity: calc(var(--star-opacity) * 0.5); transform: scale(0.9); }
  50%      { opacity: var(--star-opacity); transform: scale(1.05); }
}

.glass {
  position: relative;
  overflow: hidden;
  background: var(--glass-bg);
  border: 1px solid var(--glass-border);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  box-shadow:
    inset 1.5px -1.5px 1px -1px rgba(255, 255, 255, 0.5),
    inset -1.5px 1.5px 1px -1px rgba(255, 255, 255, 0.5),
    inset 8px -8px 20px -14px rgba(255, 255, 255, 0.4),
    inset -8px 8px 20px -14px rgba(255, 255, 255, 0.4),
    inset 0 0 24px rgba(0, 0, 0, 0.18),
    0 18px 40px var(--glass-shadow);
}

.glass::after {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  background: linear-gradient(
    135deg,
    rgba(255, 255, 255, 0.28) 0%,
    transparent 30%,
    transparent 72%,
    rgba(255, 255, 255, 0.14) 100%
  );
  mix-blend-mode: overlay;
}

.btn-gold {
  appearance: none;
  forced-color-adjust: none;
  font: inherit;
  font-family: var(--font-body);
  font-weight: 600;
  font-size: 0.95rem;
  color: var(--gold-soft);
  background: transparent;
  border: none;
  border-radius: 12px;
  padding: 0.85rem 1rem;
  cursor: pointer;
  transition: transform 0.2s ease, box-shadow 0.2s ease;
}

@media (prefers-color-scheme: light) {
  .btn-gold { color: var(--gold); }
}

.btn-gold.glass {
  background: rgba(242, 183, 5, 0.16);
  border: 1px solid rgba(242, 183, 5, 0.7);
  text-shadow: 0 0 14px rgba(242, 183, 5, 0.45);
}

.btn-gold:hover {
  transform: translateY(-2px);
  box-shadow: 0 10px 24px rgba(242, 183, 5, 0.18);
}

.btn-gold:focus-visible {
  outline: 3px solid var(--focus-ring);
  outline-offset: 2px;
}

.btn-gold:active {
  transform: translateY(0) scale(0.97);
}

body.compose {
  display: flex;
  flex-direction: column;
  align-items: stretch;
  justify-content: flex-start;
  padding: 0;
  width: 100%;
  min-height: 100dvh;
  height: auto;
  overflow-x: hidden;
  overflow-y: auto;
}

.topbar {
  position: relative;
  z-index: 10;
  width: 100%;
  padding: 1rem 1.5rem;
  background: linear-gradient(100deg, var(--accent) 0%, var(--gold) 100%);
  box-shadow: 0 6px 24px rgba(8, 6, 26, 0.3);
  flex-shrink: 0;
}

.topbar-container {
  display: flex;
  justify-content: space-between;
  align-items: center;
  width: 100%;
  max-width: 1200px;
  margin: 0 auto;
  gap: 1rem;
}

.topbar-left {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 0.25rem;
}

.topbar-center {
  flex: 1;
  text-align: center;
}

.topbar-right {
  flex: 1;
  display: flex;
  justify-content: flex-end;
  align-items: center;
}

.badge {
  display: inline-block;
  padding: 0.25rem 0.65rem;
  border-radius: 999px;
  font-size: 0.75rem;
  font-weight: 600;
  color: var(--gold-soft);
  white-space: nowrap;
}

.topbar-title {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 1.25rem;
  color: #fff;
  text-shadow: 0 2px 4px rgba(0,0,0,0.2);
}

.center-greeting {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 1.15rem;
  color: var(--gold-soft);
  text-shadow: 0 0 14px rgba(242, 183, 5, 0.5);
  white-space: nowrap;
}

.board {
  position: relative;
  z-index: 1;
  flex: 1 0 auto;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: clamp(1rem, 2.5vh, 1.8rem);
  width: 100%;
  max-width: 1400px;
  margin: 0 auto;
  padding: 1.25rem 1.5rem 6.5rem;
}

.countdown--compact {
  flex-shrink: 0;
  width: auto;
  max-width: 100%;
  display: flex;
  flex-direction: row;
  align-items: baseline;
  justify-content: center;
  gap: 0.8rem;
  flex-wrap: wrap;
  padding: 0.5rem 1.25rem;
  border-radius: 999px;
}

.countdown--compact .countdown-label { margin: 0; font-size: 0.85rem; color: var(--text-dim); }
.countdown--compact .countdown-unit { min-width: 0; display: inline-flex; flex-direction: row; align-items: baseline; gap: 0.15rem; }
.countdown--compact .num { font-family: var(--font-display); font-weight: 600; font-size: 1.1rem; font-variant-numeric: tabular-nums; }
.countdown--compact .unit-label { margin: 0; font-size: 0.75rem; color: var(--text-dim); }

.toolbar {
  flex-shrink: 0;
  width: 100%;
  max-width: 780px;
  display: flex;
  gap: 0.6rem;
  align-items: center;
}

.search-bar {
  flex: 1;
  min-width: 0;
  display: flex;
  align-items: center;
  gap: 0.7rem;
  padding: 0.6rem 1.1rem;
  border-radius: 999px;
}

.search-bar svg {
  flex: 0 0 18px;
  width: 18px;
  height: 18px;
  min-width: 18px;
  min-height: 18px;
  color: var(--text-dim);
  display: block;
}

.search-bar input {
  flex: 1;
  min-width: 0;
  font-family: var(--font-body);
  font-size: 0.95rem;
  color: var(--text);
  background: transparent;
  border: none;
  outline: none;
}

.search-bar input::placeholder { color: var(--text-dim); opacity: 0.75; }

.seg { position: relative; display: flex; padding: 3px; border-radius: 999px; flex: none; isolation: isolate; }
.seg-indicator {
  position: absolute;
  top: 3px;
  left: 3px;
  bottom: 3px;
  width: 0;
  border-radius: 999px;
  background: rgba(242, 183, 5, 0.22);
  box-shadow: 0 0 0 1px rgba(242, 183, 5, 0.35) inset;
  transition: transform 0.32s cubic-bezier(.22,1,.36,1), width 0.32s cubic-bezier(.22,1,.36,1);
  z-index: 0;
  pointer-events: none;
}

.seg button { position: relative; z-index: 1; appearance: none; forced-color-adjust: none; border: 0; background: transparent; color: var(--text-dim); font: 600 0.8rem var(--font-body); padding: 0.5rem 0.85rem; border-radius: 999px; cursor: pointer; transition: color 0.25s ease; }
.seg button[aria-pressed="true"] { color: var(--gold-soft); }

@media (prefers-reduced-motion: reduce) {
  .seg-indicator { transition: none; }
}

.explorer {
  flex: 1 0 auto;
  width: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  gap: 1rem;
  min-height: 420px;
}

.explorer-nav { display: flex; align-items: center; justify-content: center; gap: 0.6rem; width: 100%; flex-shrink: 0; }
.crumbs { align-self: center; display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 0.25rem; font-size: 0.88rem; color: var(--text-dim); }
.crumbs button { appearance: none; forced-color-adjust: none; background: none; border: 0; color: inherit; font: inherit; padding: 0.2rem 0.4rem; border-radius: 6px; cursor: pointer; transition: color 0.2s ease; }
.crumbs button:hover { color: var(--gold-soft); }
.crumbs [aria-current] { color: var(--text); font-weight: 600; cursor: default; }

.back-btn {
  appearance: none;
  forced-color-adjust: none;
  flex: none;
  display: flex;
  align-items: center;
  justify-content: center;
  width: 32px;
  height: 32px;
  padding: 0;
  border-radius: 50%;
  color: var(--text-dim);
  cursor: pointer;
  opacity: 1;
  transform: scale(1);
  transition: opacity 0.22s ease, transform 0.22s ease, color 0.2s ease;
}
.back-btn svg { width: 15px; height: 15px; }
.back-btn:hover { color: var(--gold-soft); }
.back-btn:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 2px; }
.back-btn[data-hidden="true"] { opacity: 0; transform: scale(0.7); pointer-events: none; }

@media (prefers-reduced-motion: reduce) {
  .back-btn { transition: none; }
}

.stage { width: 100%; transition: opacity 0.35s ease, transform 0.35s ease; }
.stage--flow { width: 100%; }

.stage--orbit {
  position: relative;
  width: 100%;
  max-width: 1200px;
  height: 420px;
  min-height: 380px;
  flex-shrink: 0;
  perspective: 1100px;
  perspective-origin: 50% 45%;
  user-select: none;
  -webkit-user-select: none;
  touch-action: pan-y;
  cursor: grab;
  margin: 0 auto;
  overflow: visible;
}

.stage--orbit:active {
  cursor: grabbing;
}

.carousel-3d-stage {
  position: relative;
  width: 100%;
  height: 100%;
  transform-style: preserve-3d;
  display: flex;
  align-items: center;
  justify-content: center;
}

.orbit-ellipse-bg {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%) rotateX(74deg);
  width: clamp(400px, 90vw, 850px);
  height: clamp(400px, 90vw, 850px);
  border: 1.5px dashed rgba(255, 255, 255, 0.22);
  border-radius: 50%;
  pointer-events: none;
  box-shadow: inset 0 0 35px rgba(139, 111, 232, 0.15);
}

.core-sun-3d {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate3d(-50%, -50%, 0);
  border-radius: 50%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  z-index: 10;
  pointer-events: none;
  transition: transform 0.4s ease, opacity 0.4s ease;
}

.sun-globe {
  width: clamp(90px, 15vw, 150px);
  height: clamp(90px, 15vw, 150px);
  border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #fff7d1, var(--gold-soft) 40%, var(--gold) 100%);
  box-shadow: 0 0 50px 16px rgba(242, 183, 5, 0.5), inset -6px -8px 15px rgba(0,0,0,0.25);
  animation: pulseSun 4s ease-in-out infinite alternate;
}

.subject-core-globe {
  width: clamp(100px, 18vw, 170px);
  height: clamp(100px, 18vw, 170px);
  border-radius: 50%;
  background: radial-gradient(circle at 32% 28%, rgba(255,255,255,0.75), var(--c1) 45%, var(--c2) 100%);
  box-shadow: inset -8px -10px 20px rgba(0,0,0,0.4), 0 0 45px 5px var(--c1);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0.8rem;
}

.core-title {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: clamp(0.85rem, 2.4vw, 1.05rem);
  color: #ffffff;
  text-shadow: 0 2px 8px rgba(0,0,0,0.85);
  line-height: 1.15;
  text-align: center;
}

@keyframes pulseSun {
  0% { transform: scale(1); box-shadow: 0 0 45px 12px rgba(242, 183, 5, 0.45); }
  100% { transform: scale(1.06); box-shadow: 0 0 65px 22px rgba(242, 183, 5, 0.65); }
}

.carousel-3d-ring {
  position: absolute;
  inset: 0;
  transform-style: preserve-3d;
  will-change: transform;
}

.carousel-node {
  position: absolute;
  top: 50%;
  left: 50%;
  transform-style: preserve-3d;
  will-change: transform, opacity;
  cursor: pointer;
  transition: opacity 0.35s ease, filter 0.35s ease;
}

.carousel-node.is-dim {
  opacity: 0.18 !important;
  pointer-events: none;
}

.planet-node {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: none;
  border: none;
  padding: 0;
  color: inherit;
  font: inherit;
  cursor: pointer;
  outline: none;
}

.planet-sphere {
  width: clamp(48px, 9vw, 72px);
  height: clamp(48px, 9vw, 72px);
  border-radius: 50%;
  background: radial-gradient(circle at 32% 28%, rgba(255,255,255,0.7), var(--c1) 42%, var(--c2) 100%);
  box-shadow: inset -6px -8px 14px rgba(0,0,0,0.4), 0 0 22px -2px var(--c1);
  transition: transform 0.25s ease, box-shadow 0.25s ease;
}

.planet-node:hover .planet-sphere,
.planet-node:focus-visible .planet-sphere {
  transform: scale(1.15);
  box-shadow: inset -6px -8px 14px rgba(0,0,0,0.3), 0 0 32px 4px var(--c1), 0 0 0 3px var(--focus-ring);
}

.planet-label {
  margin-top: 0.45rem;
  font-family: var(--font-body);
  font-weight: 600;
  font-size: clamp(0.72rem, 2vw, 0.85rem);
  color: var(--text);
  text-shadow: 0 2px 8px rgba(0,0,0,0.85);
  white-space: nowrap;
  pointer-events: none;
  background: rgba(16, 13, 51, 0.68);
  padding: 0.2rem 0.6rem;
  border-radius: 12px;
  border: 1px solid rgba(255, 255, 255, 0.18);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
}

.teacher-node {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: none;
  border: none;
  padding: 0;
  color: inherit;
  font: inherit;
  cursor: pointer;
  outline: none;
}

.teacher-avatar {
  width: clamp(44px, 8vw, 64px);
  height: clamp(44px, 8vw, 64px);
  border-radius: 50%;
  background: radial-gradient(circle at 32% 28%, rgba(255,255,255,0.75), var(--c1) 42%, var(--c2) 100%);
  box-shadow: inset -5px -7px 12px rgba(0,0,0,0.38), 0 0 20px -2px var(--c1);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-display);
  font-weight: 700;
  font-size: clamp(0.9rem, 2vw, 1.15rem);
  color: #fff;
  text-shadow: 0 1px 4px rgba(0,0,0,0.5);
  transition: transform 0.25s ease, box-shadow 0.25s ease;
}

.teacher-node:hover .teacher-avatar,
.teacher-node:focus-visible .teacher-avatar {
  transform: scale(1.15);
  box-shadow: inset -5px -7px 12px rgba(0,0,0,0.3), 0 0 28px 4px var(--c1), 0 0 0 3px var(--focus-ring);
}

.teacher-label {
  margin-top: 0.4rem;
  font-family: var(--font-body);
  font-weight: 600;
  font-size: clamp(0.7rem, 1.8vw, 0.82rem);
  color: var(--text);
  text-shadow: 0 2px 6px rgba(0,0,0,0.85);
  white-space: nowrap;
  pointer-events: none;
  background: rgba(16, 13, 51, 0.68);
  padding: 0.15rem 0.5rem;
  border-radius: 10px;
  border: 1px solid rgba(255, 255, 255, 0.18);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
}

.stage {
  will-change: opacity, transform, filter, height;
  transform-origin: 50% 50%;
}

.transition-out {
  opacity: 0;
  transform: scale(0.94) translateY(10px);
  filter: blur(4px);
  pointer-events: none;
  transition:
    opacity 0.22s ease,
    transform 0.22s cubic-bezier(.4,0,.2,1),
    filter 0.22s ease;
}

.transition-in {
  animation: viewSwitchIn 0.45s cubic-bezier(.22,1,.36,1) both;
}

@keyframes viewSwitchIn {
  from { opacity: 0; transform: scale(0.96) translateY(-8px); filter: blur(4px); }
  60% { opacity: 1; transform: scale(1.01) translateY(1px); filter: blur(0); }

(function () {
  'use strict';

  if (window.__SACS_ROUTER_INIT) return;
  window.__SACS_ROUTER_INIT = true;

  const AUTH_KEY = 'sacs_portal_user';

  function getCurrentUser() {
    try {
      return JSON.parse(localStorage.getItem(AUTH_KEY));
    } catch {
      return null;
    }
  }

  function setCurrentUser(userData) {
    localStorage.setItem(AUTH_KEY, JSON.stringify(userData));
  }

  function clearSession() {
    localStorage.removeItem(AUTH_KEY);
  }

  function handleLogin(email) {
    const cleanEmail = email.trim().toLowerCase();
    const isTeacher = cleanEmail.includes('teacher') || cleanEmail.includes('santos') || !cleanEmail.startsWith('100');
    
    const userData = {
      email: cleanEmail,
      role: isTeacher ? 'teacher' : 'student',
      loginTime: Date.now()
    };
    
    setCurrentUser(userData);
    window.location.href = isTeacher ? 'teacher_portal.html' : 'compose.html';
  }

  function attachInterceptors() {
    const logoutBtn = document.getElementById('logoutBtn');
    if (logoutBtn) {
      logoutBtn.addEventListener('click', (e) => {
        e.preventDefault();
        clearSession();
        window.location.href = 'index.html';
      });
    }

    const loginForm = document.getElementById('loginForm');
    if (loginForm) {
      loginForm.addEventListener('submit', (e) => {
        e.preventDefault();
        const emailInput = loginForm.querySelector('input[name="email"]');
        if (emailInput && emailInput.value) {
          handleLogin(emailInput.value);
        }
      });
    }
  }

  document.addEventListener('DOMContentLoaded', () => {
    attachInterceptors();
    
    // Fallback: Ensure active student session when testing compose directly
    let user = getCurrentUser();
    if (!user) {
      user = { email: 'student@sacs.edu.ph', role: 'student', loginTime: Date.now() };
      setCurrentUser(user);
    }
  });

  stage.classList.add("transition-out");
  setTimeout(() => {
    state.subject = subj;
    state.teacher = teach;
    currentAngle = 0;
    velocity = 0;
    render();
    stage.classList.remove("transition-out");
    stage.classList.add("transition-in");
    setTimeout(() => stage.classList.remove("transition-in"), 400);
  }, 220);
}

function render3DOrbit(list, isMoon) {
  stage.className = "stage stage--orbit";
  
  const coreHTML = isMoon
    ? `<div class="core-sun-3d">
         <div class="subject-core-globe" style="--c1:${state.subject.c1};--c2:${state.subject.c2}">
           <span class="core-title">${esc(state.subject.name)}</span>
         </div>
       </div>`
    : `<div class="core-sun-3d"><div class="sun-globe" aria-hidden="true"></div></div>`;

  stage.innerHTML = `
    <div class="carousel-3d-stage" id="carouselStage">
      <div class="orbit-ellipse-bg"></div>
      ${coreHTML}
      <div class="carousel-3d-ring" id="carouselRing"></div>
    </div>
  `;

  const ring = $("#carouselRing");
  ring.innerHTML = list.map((it, i) => {
    const c = isMoon ? state.subject : it;
    const content = isMoon
      ? `<button type="button" class="teacher-node" title="${esc(it.name)}">
           <div class="teacher-avatar" style="--c1:${c.c1};--c2:${c.c2}">${esc(it.short ? it.short.charAt(0) : it.name.charAt(0))}</div>
           <span class="teacher-label">${esc(it.short || it.name)}</span>
         </button>`
      : `<button type="button" class="planet-node" title="${esc(it.name)}">
           <div class="planet-sphere" style="--c1:${c.c1};--c2:${c.c2}"></div>
           <span class="planet-label">${esc(it.name)}</span>
         </button>`;
         
    return `<div class="carousel-node" data-i="${i}" data-name="${esc(key(it))}">${content}</div>`;
  }).join("");

  requestAnimationFrame(() => {
    update3DPositions(list.length);
  });
  startCarouselLoop(list.length);
}

function update3DPositions(count) {
  const ring = $("#carouselRing");
  if (!ring) return;

  const nodes = ring.querySelectorAll(".carousel-node");
  if (!nodes.length) return;

  const stageWidth = stage.clientWidth || 480;
  const radius = Math.min(Math.max(stageWidth * 0.42, 200), 420);
  const tiltRad = (12 * Math.PI) / 180;

  nodes.forEach((node, i) => {
    const baseAngleDeg = (360 / count) * i;
    const totalAngleDeg = baseAngleDeg + currentAngle;
    const rad = (totalAngleDeg * Math.PI) / 180;

    const x = radius * Math.sin(rad);
    const z = radius * Math.cos(rad);
    const y = z * Math.sin(tiltRad);

    const normZ = (z + radius) / (2 * radius);
    const scale = 0.72 + normZ * 0.38;
    const opacity = 0.42 + normZ * 0.58;
    const zIndex = Math.round(z + radius + 100);

    node.style.transform = `translate(-50%, -50%) translate3d(${x.toFixed(2)}px, ${y.toFixed(2)}px, ${z.toFixed(2)}px) scale(${scale.toFixed(3)})`;
    node.style.opacity = opacity.toFixed(3);
    node.style.zIndex = zIndex;
  });
}

function startCarouselLoop(count) {
  stopCarouselLoop();

  function loop() {
    if (!isDragging) {
      velocity *= 0.92;
      currentAngle += velocity;

      if (Date.now() - lastUserInteraction > 1200 && Math.abs(velocity) < 0.03) {
        currentAngle += 0.14;
      }
    }

    update3DPositions(count);
    rafId = requestAnimationFrame(loop);
  }

  rafId = requestAnimationFrame(loop);
}

function stopCarouselLoop() {
  if (rafId) {
    cancelAnimationFrame(rafId);
    rafId = null;
  }
}

function attachCarouselControls() {
  if (stage._controlsAttached) return;
  stage._controlsAttached = true;

  stage.addEventListener("pointerdown", (e) => {
    if (!e.target.closest(".carousel-3d-stage")) return;
    isDragging = true;
    startX = e.clientX || (e.touches && e.touches[0].clientX) || 0;
    lastX = startX;
    dragDistance = 0;
    lastTime = performance.now();
    velocity = 0;
    lastUserInteraction = Date.now();
  });

  window.addEventListener("pointermove", (e) => {
    if (!isDragging) return;
    const currentX = e.clientX || (e.touches && e.touches[0].clientX) || 0;
    const dx = currentX - lastX;
    const now = performance.now();
    const dt = Math.max(1, now - lastTime);

    dragDistance += Math.abs(currentX - lastX);
    velocity = (dx / dt) * 12;
    currentAngle += dx * 0.45;

    lastX = currentX;
    lastTime = now;
    lastUserInteraction = Date.now();
  });

  window.addEventListener("pointerup", () => {
    isDragging = false;
    lastUserInteraction = Date.now();
  });
  window.addEventListener("pointercancel", () => {
    isDragging = false;
    lastUserInteraction = Date.now();
  });
}
attachCarouselControls();

stage.addEventListener("click", (e) => {
  const inOrbit = !!e.target.closest(".carousel-3d-stage");
  if (inOrbit && dragDistance > 8) return;
  const node = e.target.closest("[data-i]");
  if (!node) return;
  const idx = parseInt(node.dataset.i, 10);
  const selectedItem = items()[idx];
  if (!selectedItem) return;
  if (state.subject) transitionToState(state.subject, selectedItem);
  else selectSubject(selectedItem);
});

function renderGrid(list, moon) {
  stage.className = "stage stage--flow";
  stage.innerHTML = `<div class="grid">${list.map((it, i) => {
    const c = moon ? state.subject : it;
    const sub = moon ? (unlocked() ? `${(LETTERS[it.id] || []).length} letters` : "Sealed until reveal") : `${it.teachers.length} teachers`;
    return `<button type="button" class="card glass" data-i="${i}" data-name="${esc(key(it))}" style="--c1:${c.c1};--c2:${c.c2}"><span class="dot"></span><strong>${esc(it.name)}</strong><small>${sub}</small></button>`;
  }).join("")}</div>`;
}

function renderLetters() {
  stage.className = "stage stage--flow";
  const t = state.teacher;
  let body;
  if (!unlocked()) {
    body = '<div class="lock glass"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg><strong>Letters are still sealed</strong><span>They unlock when the countdown ends.</span></div>';
  } else {
    const ls = LETTERS[t.id] || [];
    body = ls.length
      ? `<div class="letters">${ls.map((l) => { const bg = safeColor(l.bg); return `<article class="letter" data-name="${esc((l.text + " " + l.from).toLowerCase())}" style="--bg:${bg};--ink:${inkFor(bg)}"><p>${esc(l.text)}</p><footer>—${esc(l.from)}</footer></article>`; }).join("")}</div>`
      : `<p class="empty">No public letters for ${esc(t.name)} yet.</p>`;
  }
  stage.innerHTML = `<h2 class="panel-title">${esc(t.name)}</h2>${body}`;
}

function applySearch() {
  const q = search.value.trim().toLowerCase();
  stage.querySelectorAll("[data-name]").forEach((el) => el.classList.toggle("is-dim", !!q && !el.dataset.name.includes(q)));
}

crumbs.addEventListener("click", (e) => {
  const b = e.target.closest("[data-c]");
  if (b && !b.hasAttribute("aria-current")) crumbs._parts[b.dataset.c][1]();
});

function updateSegIndicator(activeBtn) {
  const seg = activeBtn.closest(".seg");
  const indicator = seg.querySelector(".seg-indicator");
  if (!indicator) return;
  const segRect = seg.getBoundingClientRect();
  const btnRect = activeBtn.getBoundingClientRect();
  const offset = btnRect.left - segRect.left - 3;
  indicator.style.width = `${btnRect.width}px`;
  indicator.style.transform = `translateX(${offset}px)`;
}

let viewSwitching = false;

function switchView(nextView, button) {
  if (nextView === state.view || viewSwitching) return;

  viewSwitching = true;

  const oldHeight = stage.getBoundingClientRect().height;
  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  document.querySelectorAll("[data-view]").forEach((x) => {
    x.setAttribute("aria-pressed", x === button);
  });
  updateSegIndicator(button);

  if (reduceMotion) {
    state.view = nextView;
    render();
    viewSwitching = false;
    return;
  }

  stage.style.height = `${oldHeight}px`;
  stage.classList.add("transition-out");

  setTimeout(() => {
    state.view = nextView;
    render();

    const newHeight = stage.scrollHeight || stage.getBoundingClientRect().height;
    stage.style.height = `${oldHeight}px`;

    requestAnimationFrame(() => {
      stage.style.transition = "height 0.45s cubic-bezier(.22,1,.36,1)";
      stage.style.height = `${newHeight}px`;
      stage.classList.remove("transition-out");
      stage.classList.add("transition-in");

      setTimeout(() => {
        stage.style.height = "";
        stage.style.transition = "";
        stage.classList.remove("transition-in");
        viewSwitching = false;
      }, 460);
    });
  }, 220);
}

document.querySelectorAll("[data-view]").forEach((b) => b.addEventListener("click", () => {
  switchView(b.dataset.view, b);
}));

window.addEventListener("resize", () => {
  const active = document.querySelector('[data-view][aria-pressed="true"]');
  if (active) updateSegIndicator(active);
});

requestAnimationFrame(() => {
  const active = document.querySelector('[data-view][aria-pressed="true"]');
  if (active) updateSegIndicator(active);
});

search.addEventListener("input", applySearch);

const PALETTE = ["#ffffff", "#f1f0f7", "#c9c6d6", "#7d7a8c", "#2b2740", "#000000", "#ffd6e0", "#ffc8a8",
  "#fff1a8", "#d8f5a2", "#b8f0d8", "#b5e8ff", "#c9d6ff", "#e2c9ff", "#ff5c8a", "#ff7a45",
  "#f2b705", "#7ed957", "#2ec4b6", "#3ea6ff", "#5b6cff", "#8b6fe8", "#c04df0", "#8a1c3a"];
const DEFAULT_BG = "#fff1a8";
const dlg = $("#letterDialog"), form = $("#letterForm"), sel = $("#toSelect"), paper = $("#letterText"), status = $("#formStatus");

sel.innerHTML = SUBJECTS.map((s) => `<optgroup label="${esc(s.name)}">${s.teachers.map((t) => `<option value="${esc(t.id)}">${esc(t.name)}</option>`).join("")}</optgroup>`).join("");
$("#palette").innerHTML = PALETTE.map((c, i) => `<input type="radio" name="bg" id="sw${i}" value="${c}" ${c === DEFAULT_BG ? "checked" : ""}><label for="sw${i}" style="--sw:${c}" title="${c}"></label>`).join("");

function paint() {
  const c = form.bg.value;
  paper.style.setProperty("--paper", c);
  paper.style.setProperty("--ink", inkFor(c));
}
$("#palette").addEventListener("change", paint);
$("#createLetterBtn").addEventListener("click", () => {
  if (state.teacher) sel.value = state.teacher.id;
  status.textContent = "";
  paint();
  dlg.showModal();
});
$("#cancelLetter").addEventListener("click", () => dlg.close());
form.anon.addEventListener("change", () => { form.from.disabled = form.anon.checked; });

// Supabase Form Submission Integration
form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const recipient = sel.value;
  const messageText = paper.value.trim();
  const senderName = form.anon.checked ? "Anonymous" : (form.from.value.trim() || "Anonymous");
  const isPublic = form.pub.checked;
  const bgColor = form.bg.value;

  if (!messageText) { 
    status.textContent = "Write something first."; 
    return; 
  }

  status.textContent = "Sending...";

  try {
    const { error } = await supabaseClient
      .from('letters')
      .insert([
        {
          to_teacher: recipient,
          text: messageText,
          sender: senderName,
          is_public: isPublic,
          bg: bgColor
        }
      ]);

    if (error) throw error;

    status.textContent = "Letter sent successfully!";
    form.reset();
    form.from.disabled = false;
    paint();
    await fetchLetters();
    setTimeout(() => dlg.close(), 900);
  } catch (err) {
    console.error("Error submitting letter to Supabase:", err);
    status.textContent = "Error sending letter. Please try again.";
  }
});

(function () {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  let active = null;

  function apply(el, x, y, rect) {
    const maxTilt = parseFloat(el.dataset.tilt) || 2.5;
    const perspective = parseFloat(el.dataset.tiltPerspective) || 700;
    const base = el.dataset.tiltBase ? el.dataset.tiltBase + " " : "";
    const cx = rect.width / 2, cy = rect.height / 2;
    const rotateY = ((x - cx) / cx) * maxTilt;
    const rotateX = ((cy - y) / cy) * maxTilt;
    el.style.transform = `${base}perspective(${perspective}px) rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
    el.style.setProperty("--mouse-x", `${x}px`);
    el.style.setProperty("--mouse-y", `${y}px`);
    if (el.tagName === "BUTTON") {
      const span = el.querySelector(":scope > span");
      if (span) span.style.transform = `perspective(500px) rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
    }
  }
  function reset(el) {
    const perspective = parseFloat(el.dataset.tiltPerspective) || 700;
    const base = el.dataset.tiltBase ? el.dataset.tiltBase + " " : "";
    el.style.transform = `${base}perspective(${perspective}px) rotateX(0deg) rotateY(0deg)`;
    el.style.setProperty("--mouse-x", "50%");
    el.style.setProperty("--mouse-y", "50%");
    if (el.tagName === "BUTTON") {
      const span = el.querySelector(":scope > span");
      if (span) span.style.transform = "perspective(500px) rotateX(0deg) rotateY(0deg)";
    }
  }
  document.addEventListener("mousemove", (event) => {
    const el = event.target.closest(".glass");
    if (el !== active && active) reset(active);
    active = el;
    if (!el) return;
    const rect = el.getBoundingClientRect();
    apply(el, event.clientX - rect.left, event.clientY - rect.top, rect);
  });
  document.addEventListener("mouseleave", () => { if (active) reset(active); active = null; }, true);
})();

// Initial UI Render & Fetch
render();
fetchLetters();
  </script>
