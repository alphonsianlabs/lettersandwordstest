*, *::before, *::after { box-sizing: border-box; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
body {

/* Page fade. Named page-* so it never collides with the stage transitions,
   and no fill-mode so no lingering transform (a lingering transform on <body>
   breaks position:fixed children). */
body.page-enter { animation: pageIn 0.4s ease; }
body.page-exit { opacity: 0; transform: scale(0.98); transition: opacity 0.3s ease, transform 0.3s ease; }
@keyframes pageIn { from { opacity: 0; transform: scale(0.98); } to { opacity: 1; transform: scale(1); } }

.o2 { width: min(70vw, 400px); height: min(70vw, 400px); bottom: -18%; right: -16%;

@media (prefers-color-scheme: light) { .orb { opacity: 0.4; } }
.star { position: absolute; background: linear-gradient(135deg, #fff, var(--gold-soft)); opacity: var(--star-opacity);

@media (prefers-reduced-motion: no-preference) {
  .star { animation: twinkle 3.4s ease-in-out infinite; }

  .s6{animation-delay:.9s}.s7{animation-delay:2s}.s8{animation-delay:1.1s}.s9{animation-delay:2.4s}
  .s10{animation-delay:.4s}.s11{animation-delay:1.8s}.s12{animation-delay:.7s}.s13{animation-delay:2.1s}
  .s14{animation-delay:1.4s}.s15{animation-delay:2.7s}.s16{animation-delay:.2s}
}
@keyframes twinkle {
  0%, 100% { opacity: calc(var(--star-opacity) * 0.5); transform: scale(0.9); }
  50% { opacity: var(--star-opacity); transform: scale(1.05); }
}

/* ---------- Glass + hover glow (same as compose) ---------- */
.glass {
  position: relative; overflow: hidden;
  background: var(--glass-bg); border: 1px solid var(--glass-border);
  backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  box-shadow:
    inset 1.5px -1.5px 1px -1px rgba(255,255,255,.5), inset -1.5px 1.5px 1px -1px rgba(255,255,255,.5),
    inset 8px -8px 20px -14px rgba(255,255,255,.4), inset -8px 8px 20px -14px rgba(255,255,255,.4),
    inset 0 0 24px rgba(0,0,0,.18), 0 18px 40px var(--glass-shadow);
}
.glass::after {
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background: linear-gradient(135deg, rgba(255,255,255,.28) 0%, transparent 30%, transparent 72%, rgba(255,255,255,.14) 100%);
  mix-blend-mode: overlay;
}
.glass {
  --mouse-x: 50%; --mouse-y: 50%;
  isolation: isolate; transform-style: preserve-3d;
  transition: transform 0.15s ease-out; will-change: transform;
}
.glass::before {
  content: ""; position: absolute; width: 220px; height: 220px;
  left: var(--mouse-x); top: var(--mouse-y); transform: translate(-50%, -50%);
  pointer-events: none; border-radius: 50%;
  background: radial-gradient(circle, rgba(255,225,120,.35) 0%, rgba(255,205,90,.18) 30%, rgba(150,110,255,.08) 50%, transparent 75%);
  filter: blur(36px); opacity: 0; transition: opacity 0.3s ease; z-index: -1;
}
.glass:hover::before, .glass:focus-within::before { opacity: 1; }
.glass > span { display: inline-block; transform-style: preserve-3d; transition: transform 0.12s ease-out; will-change: transform; }
@media (prefers-reduced-motion: reduce) { .glass, .glass::before, .glass > span { transition: none !important; } }

.badge { display: inline-block; font-size: 0.75rem; font-weight: 600; color: var(--gold-soft); padding: 0.3rem 0.9rem; border-radius: 999px; white-space: nowrap; }
.badge.glass { background: rgba(242,183,5,.16); border-color: rgba(242,183,5,.7); text-shadow: 0 0 14px rgba(242,183,5,.45); }

.btn-gold {
  appearance: none; forced-color-adjust: none; font: inherit; font-family: var(--font-body);
  font-weight: 600; font-size: 0.95rem; color: var(--gold-soft); background: transparent;
  border: none; border-radius: 12px; padding: 0.85rem 1rem; cursor: pointer;
  transition: transform 0.2s ease, box-shadow 0.2s ease;
}
@media (prefers-color-scheme: light) { .btn-gold { color: var(--gold); } }
.btn-gold.glass { background: rgba(242,183,5,.16); border: 1px solid rgba(242,183,5,.7); text-shadow: 0 0 14px rgba(242,183,5,.45); }
.btn-gold:hover { box-shadow: 0 10px 24px rgba(242,183,5,.18); }
.btn-gold:focus-visible { outline: 3px solid var(--focus-ring); outline-offset: 2px; }
.btn-gold:active { filter: brightness(.95); }

body { display: flex; flex-direction: column; align-items: stretch; }

.topbar { position: relative; z-index: 10; width: 100%; padding: 1rem 1.5rem; padding-top: max(1rem, env(safe-area-inset-top, 0px));

.topbar-container { display: flex; justify-content: space-between; align-items: center; width: 100%; max-width: 1200px; margin: 0 auto; gap: 1rem; flex-wrap: wrap; }
.topbar-left { flex: 1; display: flex; flex-direction: column; align-items: flex-start; gap: 0.25rem; min-width: 0; }
.topbar-center { flex: 1; text-align: center; }
.topbar-right { flex: 1; display: flex; justify-content: flex-end; align-items: center; }
.topbar-title { margin: 0; font-family: var(--font-display); font-weight: 700; font-size: 1.25rem; color: #fff; text-shadow: 0 2px 4px rgba(0,0,0,.2); overflow-wrap: anywhere; }
.center-greeting { font-family: var(--font-display); font-weight: 700; font-size: 1.15rem; color: var(--gold-soft); text-shadow: 0 0 14px rgba(242,183,5,.5); white-space: nowrap; }
@media (prefers-color-scheme: light) { .center-greeting { color: #fff; } .topbar .badge { color: #fff; } }
@media (max-width: 640px) {

  .topbar-left, .topbar-right { flex: 1 1 0; }
}
.btn-ghost { appearance: none; background: rgba(255,255,255,.15); border: 1px solid rgba(255,255,255,.35); color: #fff; border-radius: 12px; padding: 0.55rem 1.1rem; font: 600 0.85rem var(--font-body); cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; transition: background .2s; }
.btn-ghost:hover { background: rgba(255,255,255,.28); }
.btn-ghost:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }

.board { position: relative; z-index: 1; flex: 1 0 auto; display: flex; flex-direction: column; align-items: center; gap: 1.3rem; width: 100%; max-width: 900px; margin: 0 auto; padding: 2rem 1.5rem; }
[hidden] { display: none !important; }

.toolbar { width: 100%; display: flex; gap: 0.6rem; align-items: center; }
.search-bar { flex: 1; min-width: 0; display: flex; align-items: center; gap: 0.7rem; padding: 0.7rem 1.2rem; border-radius: 999px; }
.search-bar svg { width: 18px; height: 18px; color: var(--text-dim); flex: none; }
.search-bar input { flex: 1; min-width: 0; background: transparent; border: none; outline: none; color: var(--text); font-family: var(--font-body); font-size: 0.95rem; }
.search-bar input::placeholder { color: var(--text-dim); opacity: .75; }
.seg { display: flex; padding: 3px; border-radius: 999px; flex: none; }
.seg button { appearance: none; border: 0; background: transparent; color: var(--text-dim); font: 600 0.8rem var(--font-body); padding: 0.5rem 0.85rem; border-radius: 999px; cursor: pointer; transition: background .2s, color .2s; }
.seg button[aria-pressed="true"] { background: rgba(242,183,5,.22); color: var(--gold-soft); box-shadow: 0 0 0 1px rgba(242,183,5,.35) inset; }
@media (prefers-color-scheme: light) { .seg button[aria-pressed="true"] { color: var(--gold); } }
.seg button:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 1px; }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 1rem; width: 100%; }
.card { appearance: none; text-align: left; font: inherit; color: var(--text); border-radius: 18px; padding: 1.2rem; cursor: pointer; display: flex; flex-direction: column; gap: 0.4rem; }
.card:focus-visible { outline: 3px solid var(--focus-ring); outline-offset: 2px; }
.card-head { display: flex; justify-content: space-between; align-items: center; gap: 0.5rem; }
.card .dot { width: 26px; height: 26px; border-radius: 50%; flex: none; background: var(--sw); border: 2px solid rgba(255,255,255,.55); box-shadow: inset -3px -4px 6px rgba(0,0,0,.18); }
.card h3 { margin: 0.4rem 0 0.2rem; font-family: var(--font-display); font-size: 1.05rem; overflow-wrap: anywhere; }
.card p { margin: 0; font-size: 0.88rem; color: var(--text-dim); display: -webkit-box; -webkit-line-clamp: 2; line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
.card small { color: var(--text-dim); margin-top: 0.4rem; }
.new-tag { font-size: 0.7rem; font-weight: 600; color: #2b2740; background: var(--gold-soft); padding: 0.15rem 0.55rem; border-radius: 999px; }

.lock, .empty-state { display: flex; flex-direction: column; align-items: center; gap: 0.8rem; text-align: center; padding: 2.5rem 1.5rem; border-radius: 20px; color: var(--text-dim); width: 100%; max-width: 500px; margin-top: 1rem; }
.empty-state { box-shadow: none; }
.lock svg { width: 36px; height: 36px; color: var(--gold-soft); }
.lock strong { color: var(--text); font-size: 1.2rem; font-family: var(--font-display); }
.lock p, .empty-state p { margin: 0; font-size: 0.9rem; }
.countdown-grid { display: flex; align-items: baseline; justify-content: center; gap: 0.4rem; flex-wrap: wrap; margin-top: 0.5rem; }
.countdown-unit { display: flex; flex-direction: column; align-items: center; min-width: 3.2rem; }
.num { font-family: var(--font-display); font-weight: 600; font-size: 1.5rem; font-variant-numeric: tabular-nums; color: var(--text); }
.unit-label { font-size: 0.7rem; color: var(--text-dim); margin-top: 0.15rem; }
.countdown-sep { font-family: var(--font-display); font-size: 1.3rem; color: var(--text-dim); transform: translateY(-2px); }

.letter-dialog { border: 0; padding: 0; background: transparent; color: var(--text); width: min(92vw, 560px); max-height: 92dvh; overflow: visible; }
.letter-dialog::backdrop { background: rgba(8,6,26,.6); backdrop-filter: blur(6px); }
.letter-form { border-radius: 24px; padding: 1.5rem; display: flex; flex-direction: column; gap: 1rem; max-height: 90dvh; overflow: auto; }
.letter-head { display: flex; justify-content: space-between; align-items: center; gap: 1rem; }
.panel-title { margin: 0; font: 700 1.3rem/1.2 var(--font-display); overflow-wrap: anywhere; }
.letter { border-radius: 16px; padding: 1rem 1.1rem; background: var(--bg); color: var(--ink); box-shadow: 0 8px 20px rgba(0,0,0,.25); }
.letter p { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.letter-dialog .btn-ghost { color: var(--text); background: rgba(255,255,255,.12); border-color: var(--glass-border); }
</style>
</head>

  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const safeColor = (c) => (/^#[0-9a-f]{6}$/i.test(c) ? c : '#fff1a8');
  const inkFor = (h) => { const n = parseInt(h.slice(1), 16); return ((n >> 16) * 299 + ((n >> 8) & 255) * 587 + (n & 255) * 114) / 1000 > 150 ? '#1d1a33' : '#ffffff'; };
  const normEmail = (s) => String(s || '').trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');

  function getSession() { try { return JSON.parse(localStorage.getItem(AUTH_KEY)); } catch (e) { return null; } }
  function go(url) { document.body.classList.add('page-exit'); setTimeout(() => { window.location.href = url; }, 300); }

  /* ---------- Auth guard: identify the teacher from the session ---------- */
  const session = getSession();
  if (!session || !session.email) { window.location.replace('index.html'); return; }
  if (session.role !== 'teacher') { window.location.replace('compose.html'); return; }
  const teacher = TEACHERS.find((t) => t.id === session.tid) || TEACHERS.find((t) => t.emails.includes(normEmail(session.email)));
  if (!teacher) { try { localStorage.removeItem(AUTH_KEY); } catch (e) {} window.location.replace('index.html'); return; }

  $('#welcomeTitle').textContent = 'Welcome, ' + teacher.name + '!';
  document.title = 'Teacher Dashboard — ' + teacher.name;

  $('#logoutBtn').addEventListener('click', (e) => {
    e.preventDefault();
    try { localStorage.removeItem(AUTH_KEY); } catch (err) {}
    go('index.html');
  });
  window.addEventListener('pageshow', (e) => {
    if (e.persisted) { document.body.classList.remove('page-exit'); if (!getSession()) window.location.replace('index.html'); }
  });

  /* ---------- Countdown / lock ---------- */
  const lockedView = $('#lockedView'), unlockedView = $('#unlockedView');
  const els = { days: $('#days'), hours: $('#hours'), minutes: $('#minutes'), seconds: $('#seconds') };
  const pad = (n) => String(n).padStart(2, '0');
  let timerId, loaded = false;

  function checkReveal() {
    const remaining = REVEAL_TIME - Date.now();
    if (FORCE_UNLOCK || remaining <= 0) {
      clearInterval(timerId);
      lockedView.hidden = true;
      unlockedView.hidden = false;
      if (!loaded) { loaded = true; loadLetters(); }
      return;
    }
    lockedView.hidden = false;
    unlockedView.hidden = true;
    els.days.textContent = pad(Math.floor(remaining / 86400000));
    els.hours.textContent = pad(Math.floor((remaining % 86400000) / 3600000));
    els.minutes.textContent = pad(Math.floor((remaining % 3600000) / 60000));
    els.seconds.textContent = pad(Math.floor((remaining % 60000) / 1000));
  }

  /* ---------- Letters (Supabase) ---------- */
  let sb = null;
  try { sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY); } catch (e) { console.error('Supabase unavailable', e); }

  const READ_KEY = 'sacs_read_' + teacher.inbox + '_' + teacher.id;
  let readSet = new Set();
  try { readSet = new Set(JSON.parse(localStorage.getItem(READ_KEY)) || []); } catch (e) {}
  function saveRead() { try { localStorage.setItem(READ_KEY, JSON.stringify([...readSet])); } catch (e) {} }

  let letters = [], filter = 'all', query = '', loadError = false;

  async function loadLetters() {
    loadError = false;
    try {
      if (!sb) throw new Error('Supabase client not loaded');
      const { data, error } = await sb.from('letters').select('*').eq('to_teacher', teacher.inbox);
      if (error) throw error;
      letters = (data || []).map((row, i) => {
        const from = row.sender || row.from || 'Anonymous';
        const text = row.text || '';
        return {
          key: String(row.id != null ? row.id : (row.created_at || i) + '|' + text.slice(0, 40)),
          from, text, bg: safeColor(row.bg || '#fff1a8'),
          date: row.created_at ? new Date(row.created_at) : null,
        };
      }).sort((a, b) => (b.date ? b.date.getTime() : 0) - (a.date ? a.date.getTime() : 0));
    } catch (err) {
      console.error('Error fetching letters:', err);
      loadError = true;
      letters = [];
    }
    render();
  }

  function fmtDate(d) {
    if (!d || isNaN(d)) return '';
    return 'Received ' + d.toLocaleDateString('en-PH', { month: 'short', day: 'numeric', year: 'numeric', timeZone: 'Asia/Manila' });
  }

  function render() {
    const unread = letters.filter((l) => !readSet.has(l.key)).length;
    $('#filterAll').textContent = 'All (' + letters.length + ')';
    $('#filterUnread').textContent = 'Unread (' + unread + ')';

    const q = query.trim().toLowerCase();
    const shown = letters.filter((l) =>
      (filter === 'all' || !readSet.has(l.key)) &&
      (!q || (l.from + ' ' + l.text).toLowerCase().includes(q)));

    const grid = $('#letterGrid'), empty = $('#emptyState');
    grid.innerHTML = shown.map((l) => {
      const isNew = !readSet.has(l.key);
      return `<button type="button" class="card glass" data-key="${esc(l.key)}">
        <div class="card-head"><span class="dot" style="--sw:${l.bg}"></span>${isNew ? '<span class="new-tag">New</span>' : ''}</div>
        <h3>${esc(l.from)}</h3>
        <p>${esc(l.text)}</p>
        <small>${esc(fmtDate(l.date))}</small>
      </button>`;
    }).join('');

    empty.hidden = shown.length > 0;
    if (!shown.length) {
      $('#emptyText').textContent = loadError ? 'We could not load your letters right now. Please refresh the page in a moment.'
        : !letters.length ? 'No letters yet. Check back soon!'
        : filter === 'unread' && !q ? 'You have read every letter. 🎉' : 'No letters match your search.';
    }
  }

  $('#letterGrid').addEventListener('click', (e) => {
    const card = e.target.closest('[data-key]');
    if (!card) return;
    const l = letters.find((x) => x.key === card.dataset.key);
    if (l) openLetter(l);
  });

  document.querySelectorAll('[data-filter]').forEach((b) => b.addEventListener('click', () => {
    filter = b.dataset.filter;
    document.querySelectorAll('[data-filter]').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
    render();
  }));
  $('#searchLetters').addEventListener('input', (e) => { query = e.target.value; render(); });

  /* ---------- Modal ---------- */
  const modal = $('#letterModal');
  function openLetter(l) {
    $('#modalSender').textContent = 'From ' + l.from;
    $('#modalBody').textContent = l.text;
    const paper = $('#modalLetter');
    paper.style.setProperty('--bg', l.bg);
    paper.style.setProperty('--ink', inkFor(l.bg));
    readSet.add(l.key); saveRead();
    modal.showModal();
    render();
  }
  $('#modalClose').addEventListener('click', () => modal.close());
  modal.addEventListener('click', (e) => { if (e.target === modal) modal.close(); });

  checkReveal();
  timerId = setInterval(checkReveal, 1000);
})();

/* Hover glow + subtle tilt on every .glass element */
(function () {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  let active = null;
  function apply(el, x, y, rect) {
    const maxTilt = parseFloat(el.dataset.tilt) || 2.5;
    const perspective = parseFloat(el.dataset.tiltPerspective) || 700;
    const base = el.dataset.tiltBase ? el.dataset.tiltBase + " " : "";
    const cx = rect.width / 2, cy = rect.height / 2;
    const rotateY = ((x - cx) / cx) * maxTilt;
    const rotateX = ((cy - y) / cy) * maxTilt;
    el.style.transform = `${base}perspective(${perspective}px) rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
    el.style.setProperty("--mouse-x", `${x}px`);
    el.style.setProperty("--mouse-y", `${y}px`);
    if (el.tagName === "BUTTON") {
      const span = el.querySelector(":scope > span");
      if (span) span.style.transform = `perspective(500px) rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
    }
  }
  function reset(el) {
    const perspective = parseFloat(el.dataset.tiltPerspective) || 700;
    const base = el.dataset.tiltBase ? el.dataset.tiltBase + " " : "";
    el.style.transform = `${base}perspective(${perspective}px) rotateX(0deg) rotateY(0deg)`;
    el.style.setProperty("--mouse-x", "50%");
    el.style.setProperty("--mouse-y", "50%");
    if (el.tagName === "BUTTON") {
      const span = el.querySelector(":scope > span");
      if (span) span.style.transform = "perspective(500px) rotateX(0deg) rotateY(0deg)";
    }
  }
  document.addEventListener("mousemove", (event) => {
    const el = event.target.closest ? event.target.closest(".glass") : null;
    if (el !== active && active) reset(active);
    active = el;
    if (!el) return;
    const rect = el.getBoundingClientRect();
    apply(el, event.clientX - rect.left, event.clientY - rect.top, rect);
  });
  document.addEventListener("mouseleave", (e) => {
    if (active && e.target === active) { reset(active); active = null; }
  }, true);
  document.addEventListener("mouseout", (e) => {
    if (!e.relatedTarget && active) { reset(active); active = null; }
  });
})();
